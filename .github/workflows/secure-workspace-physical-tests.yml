name: Secure Workspace Physical Tests

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA represented by every candidate artifact.
        required: true
        type: string
      source_run_id:
        description: Same-repository Actions run containing selected platform artifacts. Not required for iOS-only tests.
        required: false
        type: string
      version:
        description: Exact OpenChamber candidate version.
        required: true
        type: string
      mobile_build_number:
        description: Exact installed mobile build number. Required for Android or iOS.
        required: false
        type: string
      android_artifact_name:
        description: Android artifact name in source_run_id.
        required: false
        type: string
      windows_artifact_name:
        description: Windows installer artifact name in source_run_id.
        required: false
        type: string
      linux_artifact_name:
        description: Linux AppImage plus manifest artifact name in source_run_id.
        required: false
        type: string
      test_android:
        description: Run the protected Android physical smoke.
        required: false
        default: false
        type: boolean
      test_ios:
        description: Run the protected iOS physical smoke against the installed TestFlight candidate.
        required: false
        default: false
        type: boolean
      test_windows:
        description: Run the protected Windows packaged Docker smoke.
        required: false
        default: false
        type: boolean
      test_linux:
        description: Run the protected Linux packaged Docker smoke.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: secure-workspace-physical-tests
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate manual test request
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.request.outputs.commit }}
      version: ${{ steps.request.outputs.version }}
      mobile_build: ${{ steps.request.outputs.mobile_build }}
      source_run_id: ${{ steps.request.outputs.source_run_id }}
      android_artifact: ${{ steps.request.outputs.android_artifact }}
      windows_artifact: ${{ steps.request.outputs.windows_artifact }}
      linux_artifact: ${{ steps.request.outputs.linux_artifact }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Validate exact candidate and selected platforms
        id: request
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ inputs.version }}
          MOBILE_BUILD: ${{ inputs.mobile_build_number }}
          ANDROID_ARTIFACT: ${{ inputs.android_artifact_name }}
          WINDOWS_ARTIFACT: ${{ inputs.windows_artifact_name }}
          LINUX_ARTIFACT: ${{ inputs.linux_artifact_name }}
          TEST_ANDROID: ${{ inputs.test_android }}
          TEST_IOS: ${{ inputs.test_ios }}
          TEST_WINDOWS: ${{ inputs.test_windows }}
          TEST_LINUX: ${{ inputs.test_linux }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ '${{ github.actor }}' == 'yulia-ivashko' ]]
          [[ "$REQUESTED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          commit="$(git rev-parse HEAD)"
          [[ "${commit,,}" == "${REQUESTED_SHA,,}" ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          if [[ "$TEST_ANDROID" != true && "$TEST_IOS" != true && "$TEST_WINDOWS" != true && "$TEST_LINUX" != true ]]; then
            echo 'Select at least one physical platform.'
            exit 1
          fi
          if [[ "$TEST_ANDROID" == true || "$TEST_WINDOWS" == true || "$TEST_LINUX" == true ]]; then
            [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
            run_identity="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '[.head_sha, .conclusion] | @tsv')"
            IFS=$'\t' read -r run_sha run_conclusion <<< "$run_identity"
            [[ "${run_sha,,}" == "${commit,,}" ]]
            [[ "$run_conclusion" == success ]]
          fi
          if [[ "$TEST_ANDROID" == true || "$TEST_IOS" == true ]]; then
            [[ "$MOBILE_BUILD" =~ ^[0-9]+$ ]]
          fi
          {
            echo "commit=$commit"
            echo "version=$VERSION"
            echo "mobile_build=$MOBILE_BUILD"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "android_artifact=${ANDROID_ARTIFACT:-openchamber-android-${VERSION}-${MOBILE_BUILD}}"
            echo "windows_artifact=${WINDOWS_ARTIFACT:-windows-release-x64}"
            echo "linux_artifact=${LINUX_ARTIFACT:-linux-release-x64}"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android automated physical smoke
    if: inputs.test_android
    needs: resolve
    runs-on: [self-hosted, mobile-android]
    environment: mobile-android
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          name: ${{ needs.resolve.outputs.android_artifact }}
          path: ${{ runner.temp }}/openchamber-android
      - name: Install exact APK and open one-time pairing link
        env:
          OPENCHAMBER_MOBILE_VERSION: ${{ needs.resolve.outputs.version }}
          OPENCHAMBER_MOBILE_BUILD: ${{ needs.resolve.outputs.mobile_build }}
          OPENCHAMBER_COMMIT: ${{ needs.resolve.outputs.commit }}
          OPENCHAMBER_PHYSICAL_CANDIDATE_EVIDENCE: ${{ runner.temp }}/android-candidate-evidence.json
          OPENCHAMBER_ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          MOBILE_E2E_CONNECT_URL: ${{ secrets.MOBILE_E2E_CONNECT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          apks=("$RUNNER_TEMP"/openchamber-android/**/*.apk)
          [[ "${#apks[@]}" == 1 ]]
          OPENCHAMBER_ANDROID_APK="${apks[0]}" node packages/mobile/scripts/physical-device-smoke.mjs android
      - name: Run automated Secure Workspace dry-run flow and cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-debug"
          status=0
          maestro test --format junit --output "$RUNNER_TEMP/maestro-android.xml" --debug-output "$RUNNER_TEMP/maestro-debug" .maestro/secure-workspace-physical.yaml || status=$?
          maestro test --debug-output "$RUNNER_TEMP/maestro-cleanup-debug" .maestro/secure-workspace-cleanup.yaml
          if [[ "$status" == 0 ]]; then
            OPENCHAMBER_PHYSICAL_CANDIDATE_EVIDENCE="$RUNNER_TEMP/android-candidate-evidence.json" \
            OPENCHAMBER_PHYSICAL_JUNIT="$RUNNER_TEMP/maestro-android.xml" \
            OPENCHAMBER_PHYSICAL_EVIDENCE="$RUNNER_TEMP/android-physical-evidence.json" \
              node packages/mobile/scripts/finalize-physical-evidence.mjs
          fi
          exit "$status"
      - name: Upload Android logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-android-physical-logs-${{ needs.resolve.outputs.commit }}
          path: |
            ${{ runner.temp }}/maestro-android.xml
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/maestro-cleanup-debug
          if-no-files-found: error
      - name: Upload Android machine result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-android-physical-result-${{ needs.resolve.outputs.commit }}
          path: ${{ runner.temp }}/android-physical-evidence.json
          if-no-files-found: error

  ios:
    name: iOS automated physical smoke
    if: inputs.test_ios
    needs: resolve
    runs-on: [self-hosted, mobile-ios]
    environment: mobile-ios
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Verify exact installed TestFlight candidate
        env:
          OPENCHAMBER_MOBILE_VERSION: ${{ needs.resolve.outputs.version }}
          OPENCHAMBER_MOBILE_BUILD: ${{ needs.resolve.outputs.mobile_build }}
          OPENCHAMBER_COMMIT: ${{ needs.resolve.outputs.commit }}
          OPENCHAMBER_PHYSICAL_CANDIDATE_EVIDENCE: ${{ runner.temp }}/ios-candidate-evidence.json
          MOBILE_E2E_CONNECT_URL: ${{ secrets.MOBILE_E2E_CONNECT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node packages/mobile/scripts/physical-device-smoke.mjs ios
      - name: Run automated Secure Workspace dry-run flow and cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-debug"
          status=0
          maestro test --format junit --output "$RUNNER_TEMP/maestro-ios.xml" --debug-output "$RUNNER_TEMP/maestro-debug" .maestro/secure-workspace-physical.yaml || status=$?
          maestro test --debug-output "$RUNNER_TEMP/maestro-cleanup-debug" .maestro/secure-workspace-cleanup.yaml
          if [[ "$status" == 0 ]]; then
            OPENCHAMBER_PHYSICAL_CANDIDATE_EVIDENCE="$RUNNER_TEMP/ios-candidate-evidence.json" \
            OPENCHAMBER_PHYSICAL_JUNIT="$RUNNER_TEMP/maestro-ios.xml" \
            OPENCHAMBER_PHYSICAL_EVIDENCE="$RUNNER_TEMP/ios-physical-evidence.json" \
              node packages/mobile/scripts/finalize-physical-evidence.mjs
          fi
          exit "$status"
      - name: Upload iOS logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-ios-physical-logs-${{ needs.resolve.outputs.commit }}
          path: |
            ${{ runner.temp }}/maestro-ios.xml
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/maestro-cleanup-debug
          if-no-files-found: error
      - name: Upload iOS machine result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-ios-physical-result-${{ needs.resolve.outputs.commit }}
          path: ${{ runner.temp }}/ios-physical-evidence.json
          if-no-files-found: error

  windows:
    name: Windows automated packaged Docker smoke
    if: inputs.test_windows
    needs: resolve
    runs-on: [self-hosted, desktop-windows]
    environment: desktop-windows
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          name: ${{ needs.resolve.outputs.windows_artifact }}
          path: ${{ runner.temp }}/openchamber-windows
      - name: Install candidate, run isolated Docker smoke, and uninstall
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          OPENCHAMBER_PACKAGED_SMOKE_PASSWORD: ${{ secrets.PHYSICAL_DESKTOP_SMOKE_PASSWORD }}
          OPENCHAMBER_PACKAGED_SMOKE_RUNTIME_IMAGE: ${{ vars.SECURE_WORKSPACE_RUNTIME_IMAGE }}
          OPENCHAMBER_PACKAGED_SMOKE_GATEWAY_IMAGE: ${{ vars.SECURE_WORKSPACE_GATEWAY_IMAGE }}
          OPENCHAMBER_VERSION: ${{ needs.resolve.outputs.version }}
          OPENCHAMBER_COMMIT: ${{ needs.resolve.outputs.commit }}
          OPENCHAMBER_PHYSICAL_DESKTOP_EVIDENCE: ${{ runner.temp }}/windows-physical-evidence.json
          OPENCHAMBER_PACKAGED_SMOKE_WORKSPACE: '1'
          OPENCHAMBER_PACKAGED_SMOKE_TIMEOUT_MS: '900000'
        run: |
          $ErrorActionPreference = 'Stop'
          docker info | Out-Null
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP/openchamber-windows/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' })
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)" }
          $installer = $installers[0]
          if ($installer.Name -notlike "*-$env:OPENCHAMBER_VERSION-win-*.exe") { throw 'Windows installer filename does not match the requested version' }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          $actualSigner = ''
          if ($env:EXPECTED_SIGNER) {
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw 'Windows installer signature or timestamp is invalid' }
            $actualSigner = $signature.SignerCertificate.Thumbprint.Replace(':', '').ToUpperInvariant()
            if ($actualSigner -ne $env:EXPECTED_SIGNER.Replace(':', '').ToUpperInvariant()) { throw 'Windows installer signer identity mismatch' }
          } elseif ($signature.Status -notin @('Valid', 'NotSigned')) {
            throw "Windows installer signature state is invalid: $($signature.Status)"
          }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs/OpenChamber'
          if (Test-Path $installRoot) { throw 'Dedicated runner already has an OpenChamber installation' }
          try {
            Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
            $executable = Join-Path $installRoot 'OpenChamber.exe'
            if (-not (Test-Path $executable)) { throw 'Installed OpenChamber executable was not found' }
            $env:OPENCHAMBER_PACKAGED_SMOKE_EXECUTABLE = $executable
            $env:OPENCHAMBER_PACKAGED_SMOKE_ARTIFACT = $installer.FullName
            $env:OPENCHAMBER_PACKAGED_SMOKE_SIGNER = $actualSigner
            node packages/electron/scripts/packaged-smoke.mjs
          } finally {
            $uninstaller = Join-Path $installRoot 'Uninstall OpenChamber.exe'
            if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
          }
      - name: Upload Windows machine result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-windows-physical-result-${{ needs.resolve.outputs.commit }}
          path: ${{ runner.temp }}/windows-physical-evidence.json
          if-no-files-found: error

  linux:
    name: Linux automated packaged Docker smoke
    if: inputs.test_linux
    needs: resolve
    runs-on: [self-hosted, desktop-linux]
    environment: desktop-linux
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          name: ${{ needs.resolve.outputs.linux_artifact }}
          path: ${{ runner.temp }}/openchamber-linux
      - name: Verify and run exact AppImage with isolated Docker smoke
        shell: bash
        env:
          OPENCHAMBER_PACKAGED_SMOKE_PASSWORD: ${{ secrets.PHYSICAL_DESKTOP_SMOKE_PASSWORD }}
          OPENCHAMBER_PACKAGED_SMOKE_RUNTIME_IMAGE: ${{ vars.SECURE_WORKSPACE_RUNTIME_IMAGE }}
          OPENCHAMBER_PACKAGED_SMOKE_GATEWAY_IMAGE: ${{ vars.SECURE_WORKSPACE_GATEWAY_IMAGE }}
          OPENCHAMBER_VERSION: ${{ needs.resolve.outputs.version }}
          OPENCHAMBER_COMMIT: ${{ needs.resolve.outputs.commit }}
          OPENCHAMBER_PHYSICAL_DESKTOP_EVIDENCE: ${{ runner.temp }}/linux-physical-evidence.json
          OPENCHAMBER_PACKAGED_SMOKE_WORKSPACE: '1'
          OPENCHAMBER_PACKAGED_SMOKE_TIMEOUT_MS: '900000'
        run: |
          set -euo pipefail
          test -n "${DISPLAY:-}"
          docker info >/dev/null
          shopt -s nullglob
          appimages=("$RUNNER_TEMP"/openchamber-linux/*.AppImage)
          manifests=("$RUNNER_TEMP"/openchamber-linux/latest*.yml)
          [[ "${#appimages[@]}" == 1 && "${#manifests[@]}" == 1 ]]
          chmod +x "${appimages[0]}"
          node packages/electron/scripts/verify-update-manifest.mjs "${manifests[0]}" "${appimages[0]}" "$OPENCHAMBER_VERSION"
          export OPENCHAMBER_PACKAGED_SMOKE_EXECUTABLE="${appimages[0]}"
          export OPENCHAMBER_PACKAGED_SMOKE_ARTIFACT="${appimages[0]}"
          export OPENCHAMBER_PACKAGED_SMOKE_CHECKSUM_VERIFIED=1
          node packages/electron/scripts/packaged-smoke.mjs
      - name: Upload Linux machine result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-linux-physical-result-${{ needs.resolve.outputs.commit }}
          path: ${{ runner.temp }}/linux-physical-evidence.json
          if-no-files-found: error
