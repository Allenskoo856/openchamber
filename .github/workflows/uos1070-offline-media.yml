name: UOS 1070 Offline Desktop Media

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or commit)
        required: true
        default: main
        type: string
      retention_days:
        description: Artifact retention days
        required: false
        default: "14"
        type: choice
        options:
          - "3"
          - "7"
          - "14"
          - "30"

permissions:
  contents: read

jobs:
  build-uos1070-x86_64:
    name: Build Debian 10 / UOS 1070 x86_64 offline media
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build AppImage and offline media inside Debian 10
        run: |
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm --platform linux/amd64 \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:10 /bin/bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              rm -f /etc/apt/sources.list.d/debian.sources
              printf "%s\n" \
                "deb http://archive.debian.org/debian buster main contrib non-free" \
                "deb http://archive.debian.org/debian buster-updates main contrib non-free" \
                "deb http://archive.debian.org/debian-security buster/updates main contrib non-free" \
                > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get -y --no-install-recommends --allow-unauthenticated install \
                ca-certificates curl git unzip xz-utils tar build-essential python3 make gcc g++ pkg-config \
                squashfs-tools libfuse2 file xauth

              NODE_VERSION=22.14.0
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
              tar -xJf /tmp/node.tar.xz -C /opt
              ln -sfn "/opt/node-v${NODE_VERSION}-linux-x64/bin/node" /usr/local/bin/node
              ln -sfn "/opt/node-v${NODE_VERSION}-linux-x64/bin/npm" /usr/local/bin/npm
              ln -sfn "/opt/node-v${NODE_VERSION}-linux-x64/bin/npx" /usr/local/bin/npx

              BUN_VERSION=1.3.14
              curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" -o /tmp/bun.zip
              mkdir -p /tmp/bun
              unzip -q /tmp/bun.zip -d /tmp/bun
              install -m 0755 /tmp/bun/bun-linux-x64/bun /usr/local/bin/bun

              bun --version
              node --version
              bun install --frozen-lockfile
              node --test packages/web/server/lib/offline-mode.test.js
              bun run --cwd packages/web test -- server/lib/opencode/openchamber-routes.test.js server/lib/package-manager.test.js
              OPENCHAMBER_TARGET_ARCH=x64 bun run --cwd packages/electron ensure:electron
              bun run --cwd packages/electron test:architecture
              bun run --cwd packages/electron test:updater

              export OPENCHAMBER_OFFLINE_BUILD=1
              export VITE_OPENCHAMBER_OFFLINE_MODE=1
              export OPENCHAMBER_TARGET_ARCH=x64
              bun run --cwd packages/electron build:web-assets
              bun run --cwd packages/electron prepare:opencode-cli
              bun run --cwd packages/electron verify:opencode-cli
              bun run --cwd packages/electron bundle:main
              bun run --cwd packages/electron rebuild:native
              bun run --cwd packages/electron package -- --linux --x64 --publish=never
              bun run --cwd packages/electron verify:opencode-cli:packaged
              bun run --cwd packages/electron verify:linux-appimage
              bun run --cwd packages/electron build:offline-media
              bun run --cwd packages/electron verify:offline-media

              chown -R "$HOST_UID:$HOST_GID" packages/electron/dist packages/electron/resources/web-dist packages/electron/resources/opencode-cli
            '

      - name: Prepare Debian 10 runtime image for no-network smoke
        run: |
          SMOKE_CONTAINER="openchamber-uos1070-smoke-${GITHUB_RUN_ID}"
          SMOKE_IMAGE="openchamber-uos1070-smoke:${GITHUB_RUN_ID}"
          docker run -d --name "$SMOKE_CONTAINER" --platform linux/amd64 debian:10 sleep 600
          docker exec "$SMOKE_CONTAINER" /bin/bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            printf "%s\n" \
              "deb http://archive.debian.org/debian buster main contrib non-free" \
              "deb http://archive.debian.org/debian buster-updates main contrib non-free" \
              "deb http://archive.debian.org/debian-security buster/updates main contrib non-free" \
              > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get -y --no-install-recommends --allow-unauthenticated install \
              ca-certificates xvfb xauth coreutils \
              libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libuuid1 libsecret-1-0 \
              libgbm1 libasound2 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 \
              libx11-xcb1 libxkbcommon0 libcups2
            useradd --create-home --uid 1000 --shell /bin/bash smoke
          '
          docker commit "$SMOKE_CONTAINER" "$SMOKE_IMAGE"
          docker rm -f "$SMOKE_CONTAINER"
          echo "SMOKE_IMAGE=$SMOKE_IMAGE" >> "$GITHUB_ENV"

      - name: Run installed AppImage with network disabled
        run: |
          set +e
          LOG_PATH="$RUNNER_TEMP/openchamber-uos1070.log"
          docker run --rm --network none --platform linux/amd64 \
            --user 1000:1000 \
            -e HOME=/tmp/home \
            -e XDG_CONFIG_HOME=/tmp/home/.config \
            -e XDG_DATA_HOME=/tmp/home/.local/share \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e ELECTRON_ENABLE_LOGGING=1 \
            -v "$GITHUB_WORKSPACE/packages/electron/dist/offline-media:/media:ro" \
            "$SMOKE_IMAGE" /bin/bash -c '
              set -eu
              mkdir -p "$HOME"
              MEDIA_DIR="$(find /media -mindepth 1 -maxdepth 1 -type d -name "openchamber-uos1070-*" -print -quit)"
              cd "$MEDIA_DIR"
              ./install.sh
              timeout 30s xvfb-run -a "$HOME/.local/bin/openchamber" --disable-gpu --no-sandbox
            ' > "$LOG_PATH" 2>&1
          SMOKE_STATUS=$?
          cat "$LOG_PATH"
          if [ "$SMOKE_STATUS" -ne 124 ]; then
            echo "Expected the desktop process to stay alive until timeout (124), got $SMOKE_STATUS." >&2
            exit "$SMOKE_STATUS"
          fi
          if ! grep -q "Starting OpenChamber on port" "$LOG_PATH"; then
            echo "Desktop startup marker was not found in the no-network smoke log." >&2
            exit 1
          fi

      - name: Upload UOS 1070 offline media
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-uos1070-x86_64-offline-${{ github.run_number }}
          path: |
            packages/electron/dist/*.tar.gz
            packages/electron/dist/*.tar.gz.sha256
            packages/electron/dist/offline-media/**
          if-no-files-found: error
          retention-days: ${{ fromJSON(inputs.retention_days) }}
